{% extends 'base.html' %}

{% block title %}Reset Password - AI Interview Stress Analyzer{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 mt-4">
            <div class="glass-card p-5 fade-in text-start">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3 rounded-circle" 
                          style="width: 64px; height: 64px; background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.3);">
                        <i class="fa-solid fa-paper-plane text-purple-400 fs-3" style="color: #c084fc;"></i>
                    </div>
                    <h2 class="fw-bold text-white">Reset Password</h2>
                    <p class="text-muted small">Enter your email address below, and we will send you a secure link to reset your account password.</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="email" class="form-label text-light small fw-bold uppercase" style="color: #cbd5e1; letter-spacing: 0.5px;">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text border-0" style="background: rgba(15, 23, 42, 0.6); color: var(--text-muted); border-radius: 10px 0 0 10px;">
                                <i class="fa-regular fa-envelope"></i>
                            </span>
                            <input type="email" name="email" id="email" class="form-control form-control-custom" style="border-radius: 0 10px 10px 0;" placeholder="Enter email address" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-premium w-100 py-3 mt-2">
                        Send Reset Link
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'login' %}" class="small text-decoration-none text-indigo-400"><i class="fa-solid fa-arrow-left me-2"></i>Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
