{% extends 'base.html' %}

{% block title %}Password Reset Complete - AI Interview Stress Analyzer{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 mt-4">
            <div class="glass-card p-5 fade-in text-center">
                <div class="d-inline-flex align-items-center justify-content-center mb-3 rounded-circle" 
                      style="width: 64px; height: 64px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3);">
                    <i class="fa-solid fa-circle-check text-success fs-3" style="color: #10b981;"></i>
                </div>
                <h2 class="fw-bold text-white mb-2">Reset Complete</h2>
                <p class="text-muted small mb-4">Your password has been successfully updated. You may now log in to your account with your new credentials.</p>
                
                <a href="{% url 'login' %}" class="btn btn-premium w-100 py-3 mt-2">
                    Proceed to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
